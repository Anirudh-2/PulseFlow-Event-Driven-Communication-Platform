services:
  postgres:
    image: postgres:16
    container_name: pulseflow-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: pulseflow-redis
    # Run Redis on internal Docker network only to avoid host port conflicts.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pulseflow-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: pulseflow-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./pulseflow-realm.json:/opt/keycloak/data/import/pulseflow-realm.json:ro
  backend:
    build:
      context: ./backend
    container_name: pulseflow-backend
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI_DOCKER}
      APP_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/pulseflow/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      RABBITMQ_DELIVERY_ASYNC: ${RABBITMQ_DELIVERY_ASYNC:-true}
      SERVER_PORT: ${SERVER_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_FROM: ${SMTP_FROM}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - keycloak
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: pulseflow
        VITE_KEYCLOAK_CLIENT_ID: pulseflow-frontend
    container_name: pulseflow-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  pg_data:
