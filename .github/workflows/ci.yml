name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend unit + Testcontainers tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and unit test
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (optional local Vite)
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 &
          npx --yes wait-on http://127.0.0.1:5173
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5173 npx playwright test
        continue-on-error: true

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pulseflow-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t pulseflow-frontend:ci ./frontend
