services:
  postgres:
    image: postgres:16
    container_name: pulseflow-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pulseflow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulseflow-redis

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pulseflow-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: pulseflow-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../pulseflow-realm.json:/opt/keycloak/data/import/pulseflow-realm.json:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseflow-backend
    env_file:
      - ../.env
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pulseflow}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SCHEMA: ${DB_SCHEMA:-notif}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-pulseflow.events}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-pulseflow.events.queue}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-pulseflow.events.dlq}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Must match the `iss` claim in JWTs your clients receive (often http://localhost:8080/realms/pulseflow for browser + Keycloak on host port 8080).
      # Keep issuer validation matching the public Keycloak hostname (KC_HOSTNAME, default localhost).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI_DOCKER:-http://localhost:8080/realms/pulseflow}
      APP_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/pulseflow/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      SERVER_PORT: ${SERVER_PORT:-8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-no-reply@pulseflow.local}
      HRMS_WEBHOOK_API_KEY: ${HRMS_WEBHOOK_API_KEY:-changeme}
      HRMS_DEFAULT_TENANT_ID: ${HRMS_DEFAULT_TENANT_ID:-default}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_BOT_USER_ID: ${GRAPH_BOT_USER_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_PARSE_MODE: ${TELEGRAM_PARSE_MODE:-Markdown}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - keycloak
    restart: unless-stopped

volumes:
  pg_data:
